[package]
name        = "bmp390-nv"
version     = "0.1.1"
description = "A driver for Bosch's BMP390 digital pressure sensor on an I2C or an SPI bus: pressure in pascals and temperature in millidegrees Celsius, compensated with the data sheet's formulas from the trimming coefficients, forced and normal mode, oversampling, the IIR filter, the data-ready line and the chip identity, as devices-nv's Barometer, Thermometer and Identifiable."
license     = "Apache-2.0"
stability   = "experimental"
category    = "embedded"
layer       = "host"
tags        = ["bmp390", "bmp388", "barometer", "pressure", "thermometer", "i2c", "spi", "sensor", "nrf52840-dk", "nrf54lm20-dk"]
repository  = "https://github.com/novolang/bmp390-nv"
maintainers = ["novo-lang"]
novo        = ">= 0.24.0"

[docs.pages]
"README.md" = "Reading a BMP390 pressure sensor from a device program"

[dependencies]
# The board's I2C bus, SPI bus and GPIO handles, and the I2cBus, SpiBus
# and GpioOut traits they implement.
embedded-hal-nv = "^0.4.0"
# The wiring record a board's device table hands `attach`, the register
# helpers, and the Barometer, Thermometer and Identifiable traits.
devices-nv      = "^0.4.0"
